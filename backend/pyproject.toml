[project]
name = "direct-demand-api"
version = "0.1.0"
description = "Direct Demand Portal API — phase 1 (Live Inventory + Supply Pipeline)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    "gspread>=6.1",
    "google-auth>=2.30",
    "apscheduler>=3.10,<4",
    "pyjwt>=2.9",
    "pydantic[email]>=2.4",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
