# Local production-parity stack: backend + frontend.
# The backend still uses DATABASE_URL/PROPERTIES_DATABASE_URL from backend/.env
# (shared Neon/properties DBs).  Run:  docker compose up --build
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: [backend/.env]    # DB urls, Google SA, CRM key, etc.
    environment:
      APP_ENV: dev              # keep fail-closed off locally
      RUN_SCHEDULER: "${RUN_SCHEDULER:-true}"   # set RUN_SCHEDULER=false to skip cron locally
      LOG_JSON: "false"
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    restart: unless-stopped
    ports: ["5173:80"]
    depends_on: [backend]

# Optional fully-local Postgres (off by default — we use the shared Neon DB).
# Enable with:  docker compose --profile localdb up
  postgres:
    image: postgres:16-alpine
    profiles: ["localdb"]
    environment:
      POSTGRES_USER: ddp
      POSTGRES_PASSWORD: ddp
      POSTGRES_DB: direct_demand
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

volumes:
  pgdata:
