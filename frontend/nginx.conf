server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # security headers (the API sets its own; these cover the static app). NOTE: these
    # are inherited by the location blocks below only because those use `expires`
    # (not `add_header`) for caching — an `add_header` in a location would reset these.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # long-cache hashed assets; never cache the HTML shell
    location /assets/ {
        expires 1y;
    }
    location = /index.html {
        expires -1;          # Cache-Control: no-cache
    }

    # SPA fallback — deep links (/inventory, /supply, /leads/:id) serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
