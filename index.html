<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Openhouse — Direct Demand Dashboard</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DIRECT DEMAND DASHBOARD — refined semantic colour system
   ------------------------------------------------------------
   Canvas  : cool near-white so colour-coded chips read clearly
   Stages  : a logical hue ramp (blue→cyan→amber→violet→indigo→
             emerald) + red/gold/slate for the terminal states
   TAT     : traffic-light (green / amber / red)
   Sources : kept on brand colours, harmonised soft backgrounds
   ============================================================ */
:root{
  /* neutrals (cool) */
  --bg:#f5f7fa;
  --panel:#ffffff;
  --panel-2:#f2f5f9;
  --ink:#0f172a;
  --ink-2:#46536b;
  --muted:#8a94a6;
  --line:#e6eaf1;
  --line-2:#eef1f6;
  --ink-sidebar:#0e1420;
  --ink-sidebar-2:#1a2434;

  /* semantic accents — each with a soft tint */
  --emerald:#059669;  --emerald-soft:#d6f3e5;   /* won / success      */
  --blue:#2563eb;     --blue-soft:#dde8fe;       /* new                */
  --cyan:#0e8fa8;     --cyan-soft:#cdeef4;       /* contacted          */
  --amber:#d68309;    --amber-soft:#fdeccb;      /* visit scheduled    */
  --violet:#7c3aed;   --violet-soft:#ebe5fd;     /* visit feedback     */
  --indigo:#4f46e5;   --indigo-soft:#e2e2fc;     /* negotiation        */
  --gold:#b8860b;     --gold-soft:#fbf0cc;       /* gold mine / future */
  --coral:#e11d48;    --coral-soft:#ffe1e6;      /* lost / breach      */
  --slate:#64748b;    --slate-soft:#eceff4;      /* timepass           */

  --radius:14px;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 10px 30px -14px rgba(15,23,42,.16);
  --shadow-lg:0 28px 64px -22px rgba(15,23,42,.40);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"Hanken Grotesk",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
}
.app{display:grid;grid-template-columns:248px 1fr;height:100vh;overflow:hidden}

/* ---------------- Sidebar ---------------- */
.sidebar{
  background:linear-gradient(180deg,#111a2b,var(--ink-sidebar));
  color:#c2cad8;
  display:flex;flex-direction:column;
  padding:18px 14px;
  border-right:1px solid #080b12;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .logo{
  width:38px;height:38px;flex:none;
  display:grid;place-items:center;
}
.brand .logo svg{width:38px;height:38px;display:block}
.brand .nm{font-family:"Bricolage Grotesque";font-weight:700;font-size:17px;color:#fff;letter-spacing:-.01em;line-height:1}
.brand .sub{font-size:10.5px;color:#7c879c;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.proto-pill{
  margin:2px 8px 14px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:#f0c34a;background:rgba(184,134,11,.16);border:1px solid rgba(184,134,11,.34);
  padding:4px 8px;border-radius:6px;display:inline-block;font-weight:600;width:fit-content;
}
.nav-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#5a6577;padding:14px 10px 6px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;
  cursor:pointer;color:#a4adbe;font-weight:500;font-size:13.5px;transition:.14s;position:relative;
}
.nav-item svg{width:17px;height:17px;flex:none;stroke-width:1.8}
.nav-item:hover{background:var(--ink-sidebar-2);color:#e8ebf1}
.nav-item.active{background:var(--ink-sidebar-2);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;background:#10b981;border-radius:0 3px 3px 0}
.nav-item .badge{margin-left:auto;background:var(--coral);color:#fff;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;font-family:"Spline Sans Mono"}
.nav-item .badge.gold{background:var(--gold)}
.nav-item .badge.soft{background:#2a3445;color:#aeb7c5}
.sidebar .spacer{flex:1}
.user{
  display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;
  background:var(--ink-sidebar-2);margin-top:10px;cursor:pointer;
}
.user .av{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#37425a,#222b3c);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.user .un{color:#fff;font-weight:600;font-size:13px;line-height:1.1}
.user .ur{color:#7c879c;font-size:11px}
.role-chip{font-size:9.5px;background:rgba(37,99,235,.22);color:#9bbafb;padding:2px 7px;border-radius:5px;font-weight:600;margin-left:auto}

/* ---------------- Main ---------------- */
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{
  height:60px;flex:none;display:flex;align-items:center;gap:14px;padding:0 26px;
  border-bottom:1px solid var(--line);background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
}
.topbar h1{font-family:"Bricolage Grotesque";font-weight:700;font-size:20px;margin:0;letter-spacing:-.02em}
.topbar .crumb{color:var(--muted);font-size:13px}
.search{
  margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--line);border-radius:9px;padding:7px 12px;width:240px;color:var(--muted);
}
.search input{border:0;background:0;outline:0;font:inherit;color:var(--ink);width:100%}
.icon-btn{
  width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2);position:relative;transition:.14s;
}
.icon-btn:hover{border-color:#cdd5e2;background:var(--panel-2)}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--coral);border:2px solid var(--panel)}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:0;border-radius:9px;padding:9px 15px;
  font:inherit;font-weight:600;font-size:13px;cursor:pointer;transition:.14s;white-space:nowrap;
}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#000;transform:translateY(-1px)}
.btn.green{background:var(--emerald);color:#fff}
.btn.green:hover{background:#047a55;transform:translateY(-1px)}
.btn.wa{background:#25b15a;color:#fff}
.btn.wa:hover{background:#1d964c}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink-2)}
.btn.ghost:hover{border-color:#cdd5e2;background:var(--panel-2)}
.btn.gold{background:var(--gold);color:#fff}
.btn.gold:hover{background:#9c7109}
.btn.orange{background:#f97316;color:#fff}
.btn.orange:hover{background:#ea580c;transform:translateY(-1px)}
.btn-badge{background:rgba(255,255,255,.28);color:#fff;font-weight:700;font-size:11px;padding:1px 7px;border-radius:20px;font-family:"Spline Sans Mono";line-height:1.4}
.wa-ico{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#25b15a;color:#fff;border:0;cursor:pointer;transition:.14s}
.wa-ico:hover{background:#1d964c;transform:translateY(-1px)}
.wa-ico svg{width:19px;height:19px}
.btn.sm{padding:6px 11px;font-size:12px}

.view{flex:1;overflow-y:auto;padding:26px}
.view::-webkit-scrollbar{width:10px}
.view::-webkit-scrollbar-thumb{background:#d3dae5;border-radius:10px;border:3px solid var(--bg)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.stat-row{grid-template-columns:repeat(4,1fr)}
.stat{padding:18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--line))}
.stat .k{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:7px}
.stat .v{font-family:"Bricolage Grotesque";font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.stat .d{font-size:12px;font-weight:600}
.stat .ico{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.up{color:var(--emerald)}.down{color:var(--coral)}
/* clickable dashboard stat cards */
.stat.clickable{cursor:pointer}
.stat.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
/* moving-light highlight (sweeping sheen + glow) — used on the urgent New Leads card */
.live-glow{position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(37,99,235,.35),0 16px 42px -18px rgba(37,99,235,.5)}
.live-glow::before{content:"";position:absolute;top:0;left:0;height:100%;width:42%;pointer-events:none;z-index:3;
  background:linear-gradient(100deg,transparent 0%,rgba(37,99,235,.04) 35%,rgba(96,165,250,.30) 50%,rgba(37,99,235,.04) 65%,transparent 100%);
  transform:translateX(-200%);animation:sheen 2.8s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sheen{0%{transform:translateX(-200%)}55%{transform:translateX(320%)}100%{transform:translateX(320%)}}
.stat .ico svg{width:17px;height:17px;stroke-width:1.9}
/* running border light — bold cue around the New Leads card when its pill is hovered/clicked */
@property --rl{syntax:'<angle>';inherits:false;initial-value:0deg}
.runlight{position:relative}
.runlight::after{content:"";position:absolute;inset:-3px;border-radius:17px;z-index:6;pointer-events:none;padding:3px;
  background:conic-gradient(from var(--rl),rgba(37,99,235,0) 0deg,rgba(37,99,235,0) 230deg,#2563eb 295deg,#7db0ff 325deg,rgba(37,99,235,0) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:runborder 1.05s linear infinite}
@keyframes runborder{to{--rl:360deg}}
.sec-title{font-family:"Bricolage Grotesque";font-weight:700;font-size:16px;margin:0 0 2px;letter-spacing:-.01em}
.sec-sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

/* table */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line)}
td{padding:13px 14px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.lead-row{cursor:pointer;transition:.1s}
tr.lead-row:hover{background:var(--panel-2)}
.who{display:flex;align-items:center;gap:10px}
.who .av{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#e4e9f1,#d3dbe8);display:grid;place-items:center;font-weight:700;color:var(--ink-2);font-size:12px;flex:none}
.who .nm{font-weight:600}
.who .ph{font-size:11.5px;color:var(--muted);font-family:"Spline Sans Mono"}

/* source badges — kept on recognisable brand colours */
.src{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px}
.src::before{content:"";width:7px;height:7px;border-radius:2px}
.src.meta{background:#e3edfe;color:#1856c9}.src.meta::before{background:#1877f2}
.src.gads{background:#dcf3e4;color:#157a38}.src.gads::before{background:#34a853}
.src.acres{background:#fde7da;color:#bf4d08}.src.acres::before{background:#ed5a0a}
.src.bricks{background:#fde0ea;color:#bd1c53}.src.bricks::before{background:#e63a73}
.src.yt{background:#fde1e1;color:#c01c1c}.src.yt::before{background:#ff0000}
.src.wa{background:#daf3e3;color:#12823f}.src.wa::before{background:#25d366}

/* stage chips — a logical colour ramp across the pipeline */
.stage{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;border:1px solid transparent}
.stage::before{content:"";width:6px;height:6px;border-radius:50%}
.stage.new{background:var(--blue-soft);color:var(--blue)}.stage.new::before{background:var(--blue)}
.stage.contacted{background:var(--cyan-soft);color:var(--cyan)}.stage.contacted::before{background:var(--cyan)}
.stage.visit{background:var(--amber-soft);color:var(--amber)}.stage.visit::before{background:var(--amber)}
.stage.feedback{background:var(--violet-soft);color:var(--violet)}.stage.feedback::before{background:var(--violet)}
.stage.nego{background:var(--indigo-soft);color:var(--indigo)}.stage.nego::before{background:var(--indigo)}
.stage.won{background:var(--emerald-soft);color:var(--emerald)}.stage.won::before{background:var(--emerald)}
.stage.lost{background:var(--coral-soft);color:var(--coral)}.stage.lost::before{background:var(--coral)}
.stage.future{background:var(--gold-soft);color:var(--gold)}.stage.future::before{background:var(--gold)}
.stage.timepass{background:var(--slate-soft);color:var(--slate)}.stage.timepass::before{background:var(--slate)}

/* TAT — traffic light */
.tat{display:inline-flex;align-items:center;gap:6px;font-family:"Spline Sans Mono";font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:7px}
.tat.ok{background:var(--emerald-soft);color:#06694b}
.tat.warn{background:var(--amber-soft);color:#9a5e07}
.tat.breach{background:var(--coral-soft);color:var(--coral);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* follow-up (callback) chips */
.fu{display:inline-flex;align-items:center;gap:4px;font-family:"Spline Sans Mono";font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.fu.over{background:var(--coral-soft);color:var(--coral)}
.fu.today{background:var(--amber-soft);color:#9a5e07}
.fu.up{background:var(--blue-soft);color:var(--blue)}
/* last-contact outcome chips */
.oc{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap}
.oc.ok{background:var(--emerald-soft);color:#06694b}
.oc.bad{background:#fbe6cf;color:#9a5e07}
.oc .att{font-family:"Spline Sans Mono";opacity:.75}
/* hot / immediate-buyer */
.flame{font-size:13px;margin-left:6px;vertical-align:middle}
.hot-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:20px;background:#ffe7d6;color:#c2410c;border:1px solid #f9c9a4}
/* follow-up radar rows */
.fr-row{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:.12s}
.fr-row:hover{background:var(--panel-2);border-color:#cdd5e2}
.fr-row .av{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#e4e9f1,#d3dbe8);display:grid;place-items:center;font-weight:700;color:var(--ink-2);font-size:12px;flex:none}
.fr-row .nt{font-size:11.5px;color:var(--muted);margin-top:1px}
/* loss-reason analytics */
.loss-split{display:flex;gap:10px;margin-bottom:14px}
.loss-split .box{flex:1;border:1px solid var(--line);border-radius:11px;padding:12px}
.loss-split .box.op{background:var(--coral-soft);border-color:#f3c6cd}
.loss-split .box.gen{background:var(--slate-soft);border-color:#dde2ea}
.loss-split .box .n{font-family:"Bricolage Grotesque";font-size:24px;font-weight:800;line-height:1}
.loss-split .box.op .n{color:var(--coral)}.loss-split .box.gen .n{color:var(--slate)}
.loss-split .box .lab{font-size:11px;font-weight:600;margin-top:3px}
.loss-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.loss-row .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loss-row .lbar{width:90px;height:9px;border-radius:6px;background:var(--line);overflow:hidden;flex:none}
.loss-row .lbar i{display:block;height:100%;border-radius:6px}
.loss-row.op .lbar i{background:var(--coral)}.loss-row.gen .lbar i{background:var(--slate)}
.loss-row .lc{font-family:"Spline Sans Mono";color:var(--muted);width:18px;text-align:right;flex:none}
.loss-tag{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;flex:none}
.loss-tag.op{background:#fff;color:var(--coral);border:1px solid #f3c6cd}
.loss-tag.gen{background:#fff;color:var(--slate);border:1px solid #dde2ea}
.signal-row{grid-template-columns:repeat(3,1fr)}
.kpi-row{grid-template-columns:repeat(3,1fr)}

/* ---- visit planner (multi-stop route) ---- */
.modal.wide{width:min(940px,100%)}
.plan-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 14px}
.plan-pick,.plan-itin{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel-2);max-height:300px;overflow:auto}
.plan-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
.pick-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
.pick-row .pk-n{font-weight:600;font-size:12.5px}
.pick-row .pk-l{font-size:11px;color:var(--muted)}
.pick-row .pk-add{margin-left:auto}
.pick-row.added{opacity:.55}
.itin-empty{font-size:12px;color:var(--muted);text-align:center;padding:24px 8px}
.itin-stop{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.itin-stop .num{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;font-family:"Spline Sans Mono"}
.itin-stop .sn{font-weight:600;font-size:12.5px;line-height:1.2}
.itin-stop .sl{font-size:11px;color:var(--muted)}
.itin-stop .ops{margin-left:auto;display:flex;gap:4px}
.itin-stop .ops button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:12px;color:var(--ink-2);display:grid;place-items:center}
.itin-stop .ops button:hover{border-color:#cdd5e2}
.leg{display:flex;align-items:center;gap:7px;font-family:"Spline Sans Mono";font-size:11px;color:var(--ink-2);padding:5px 0 5px 11px;border-left:2px dashed var(--line);margin-left:11px}
.leg .lp{width:6px;height:6px;border-radius:50%;background:var(--amber)}
.totals{display:flex;gap:10px;margin-top:12px}
.totals .tbox{flex:1;border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:linear-gradient(180deg,#f1f6ff,#fff)}
.totals .tbox .tv{font-family:"Bricolage Grotesque";font-weight:800;font-size:20px;line-height:1}
.totals .tbox .tl{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.plan-map{height:300px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:var(--panel-2)}
.map-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:12.5px;padding:24px;gap:8px}
.map-empty code{font-family:"Spline Sans Mono";font-size:11px;background:var(--panel);border:1px solid var(--line);padding:2px 6px;border-radius:5px;color:var(--ink-2)}
.route-est{font-size:10.5px;font-weight:600;color:var(--amber);margin-top:6px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.itin-stop .ops button:disabled{opacity:.3;cursor:not-allowed}
.opt-btn{padding:4px 10px;font-size:11px}

/* toast */
#toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:10px;z-index:80}
.toast{background:var(--ink);color:#fff;padding:13px 16px;border-radius:11px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;min-width:260px;animation:slidein .3s cubic-bezier(.2,.8,.2,1)}
.toast .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
.toast.wa .ic{background:#25d366}.toast.green .ic{background:var(--emerald)}.toast.gold .ic{background:var(--gold)}.toast.blue .ic{background:var(--blue)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.46);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:90;padding:24px}
.overlay.show{display:flex}
.modal{background:var(--panel);border-radius:18px;box-shadow:var(--shadow-lg);width:min(540px,100%);max-height:90vh;overflow:auto;animation:slideup .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slideup{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.modal .mh{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal .mh h3{font-family:"Bricolage Grotesque";margin:0;font-size:18px}
.modal .mb{padding:22px}
.modal .mf{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--panel-2)}

/* form */
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field label .req{color:var(--coral)}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;
  background:var(--panel-2);color:var(--ink);outline:0;transition:.14s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--emerald);background:#fff;box-shadow:0 0 0 3px var(--emerald-soft)}
.field.invalid input,.field.invalid select{border-color:var(--coral);background:var(--coral-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}

/* lead detail */
.detail-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;font-weight:600;font-size:13px;margin-bottom:14px}
.back:hover{color:var(--ink)}
.lead-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.lead-head .av{width:54px;height:54px;border-radius:13px;background:linear-gradient(135deg,#10b981,#047857);display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px;font-family:"Bricolage Grotesque"}
.lead-head h2{font-family:"Bricolage Grotesque";margin:0;font-size:23px;letter-spacing:-.02em}
.lead-head .meta{color:var(--muted);font-size:13px;font-family:"Spline Sans Mono";margin-top:2px}
.lead-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.stage-control{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 10px}
.stage-control label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stage-control select{border:0;background:0;outline:0;font:inherit;font-weight:600;font-size:13px;color:var(--ink);cursor:pointer}
.meta-card{border-color:#c9ddfb;background:linear-gradient(180deg,#f1f6ff,#ffffff 60%)}
.meta-card .field input,.meta-card .field select{background:#fff}
.meta-card .field select:disabled{background:#edf2fa;color:var(--ink-2);cursor:not-allowed;opacity:1;-webkit-text-fill-color:var(--ink-2)}
.lock-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:20px;background:#edf1f8;color:#586378;border:1px solid #d6deeb}
.lock-badge.editable{background:var(--emerald-soft);color:#06694b;border-color:#aedcc4}
.src-banner{font-size:12px;font-weight:500;padding:9px 12px;border-radius:9px;margin-bottom:14px;line-height:1.5}
.src-banner.meta{background:#e3edfe;color:#194a9e;border:1px solid #c9ddfb}
.src-banner.confirmed{background:var(--emerald-soft);color:#06694b;border:1px solid #aedcc4}
.cfg-chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--amber-soft);color:var(--amber)}
.plan-chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;white-space:nowrap}
.plan-chip.plan-hot{background:var(--emerald-soft);color:#06694b}
.plan-chip.plan-warm{background:var(--amber-soft);color:#9a5e07}
.plan-chip.plan-cool{background:var(--blue-soft);color:var(--blue)}
.plan-chip.plan-cold{background:var(--slate-soft);color:var(--slate)}
/* Q6 office-visit pitch box */
.office-pitch{margin-top:8px;border:1px solid #ead9a0;background:linear-gradient(135deg,#fdf7e6,#fffdf7);border-radius:12px;padding:13px 15px}
.office-pitch .op-head{font-weight:700;font-size:12.5px;color:#8a6408;margin-bottom:8px}
.office-pitch .op-sub{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:11px 0 6px;border-top:1px dashed #ead9a0;padding-top:9px}
.office-pitch .op-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.office-pitch .op-list li{font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.office-pitch .op-list.hi li{color:#7a6a4a;font-style:italic}
/* multi-select checkbox dropdown */
.ms{position:relative}
.ms-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--panel-2);cursor:pointer}
.ms.open .ms-toggle{border-color:var(--emerald);background:#fff;box-shadow:0 0 0 3px var(--emerald-soft)}
.ms-summary{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-summary.empty{color:var(--muted)}
.ms-toggle svg{width:14px;height:14px;color:var(--muted);flex:none;transition:.15s}
.ms.open .ms-toggle svg{transform:rotate(180deg)}
.ms-panel{display:none;position:absolute;z-index:30;left:0;right:0;top:calc(100% + 5px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:230px;overflow:auto;padding:6px}
.ms.open .ms-panel{display:block}
.ms-opt{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:7px;cursor:pointer;font-size:13px}
.ms-opt:hover{background:var(--panel-2)}
.ms-opt input{width:16px;height:16px;flex:none;accent-color:var(--emerald);cursor:pointer}
/* matched-option rows (inventory / supply) on the lead detail — expandable */
.opt{border:1px solid var(--line);border-radius:11px;margin-bottom:8px;overflow:hidden;transition:.12s}
.opt:hover{border-color:#cdd5e2}
.opt.open{border-color:#cdd5e2;background:var(--panel-2)}
.opt-row{display:flex;align-items:center;gap:11px;padding:9px;cursor:pointer}
.opt-thumb{width:50px;height:46px;border-radius:8px;background-size:cover;background-position:center;flex:none}
.opt-info{flex:1;min-width:0}
.opt-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt-meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.opt-chev{width:15px;height:15px;color:var(--muted);flex:none;transition:.15s}
.opt.open .opt-chev{transform:rotate(180deg)}
.opt-detail{display:none;padding:2px 12px 12px 70px}
.opt.open .opt-detail{display:block}
.opt-dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12px}
.opt-dt{color:var(--muted);font-weight:600;white-space:nowrap}
.opt-dd{color:var(--ink-2)}
.field select[multiple]{height:auto;padding:6px}
.field select[multiple] option{padding:4px 7px;border-radius:5px}
.bucket-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--gold-soft);color:#8a6408;border:1px solid #ead9a0}
.bucket-card{overflow:hidden}
.bucket-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background-size:cover;background-position:center;color:#fff}
.bucket-head .bn{font-family:"Bricolage Grotesque";font-weight:700;font-size:16px;letter-spacing:-.01em}
.bucket-head .bmeta{font-size:12px;opacity:.92;margin-top:3px}
.bucket-head .bcount{font-family:"Bricolage Grotesque";font-weight:800;font-size:28px;line-height:1;display:flex;flex-direction:column;align-items:center}
.bucket-head .bcount span{font-family:"Hanken Grotesk";font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.9;margin-top:3px}
.bl-row{display:flex;align-items:flex-start;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.bl-row .av{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#dcab39);display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;flex:none}
.match-mini{font-family:"Spline Sans Mono";font-size:10.5px;font-weight:600;color:var(--emerald);background:var(--emerald-soft);padding:1px 6px;border-radius:5px;margin-left:4px}
.bl-row .why{font-size:10.5px;color:#8a6408;font-weight:600;margin-top:3px}
.panel-pad{padding:18px}
.panel-title{font-weight:700;font-size:13.5px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.panel-title svg{width:16px;height:16px;color:var(--muted)}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--panel);border:2.5px solid var(--emerald)}
.tl-item.dim::before{border-color:var(--line)}
.tl-item .tt{font-weight:600;font-size:13px}
.tl-item .tm{font-size:11.5px;color:var(--muted);font-family:"Spline Sans Mono"}
.tl-item .tl-remark{font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border-left:2px solid var(--emerald);border-radius:0 7px 7px 0;padding:6px 10px;margin:5px 0 4px;line-height:1.45;font-style:italic}

/* suggestion / inventory cards */
.inv-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);transition:.16s}
.inv-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:#cdd5e2}
.inv-img{height:118px;background-size:cover;background-position:center;position:relative}
.inv-img .tag{position:absolute;top:9px;left:9px;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.95);padding:3px 8px;border-radius:6px;color:var(--ink)}
.inv-img .match{position:absolute;top:9px;right:9px;font-size:10.5px;font-weight:700;background:var(--emerald);color:#fff;padding:3px 8px;border-radius:6px}
.inv-body{padding:13px}
.inv-body .nm{font-weight:700;font-size:14px}
.inv-body .loc{font-size:12px;color:var(--muted);margin:2px 0 8px;display:flex;align-items:center;gap:4px}
.inv-body .pr{font-family:"Bricolage Grotesque";font-weight:700;font-size:17px}
.inv-meta{display:flex;gap:10px;font-size:11.5px;color:var(--ink-2);margin:8px 0 12px;flex-wrap:wrap}
.inv-meta span{background:var(--panel-2);border:1px solid var(--line);padding:3px 8px;border-radius:6px}
.inv-actions{display:flex;gap:8px}
.cards-3{grid-template-columns:repeat(3,1fr)}
.cards-2{grid-template-columns:repeat(2,1fr)}

.empty{padding:30px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:34px;margin-bottom:8px;opacity:.5}

/* like btn */
.like{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;cursor:pointer;font:inherit;font-weight:600;font-size:12.5px;color:var(--ink-2);transition:.14s}
.like:hover{border-color:var(--gold);color:var(--gold)}
.like.on{background:var(--gold-soft);border-color:var(--gold);color:#8a6408}
.interest-bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:9px 0}
.interest-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#dcab39);border-radius:6px}

/* supply stage */
.sup-stage{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px}
.sup-stage.msi{background:var(--slate-soft);color:var(--slate)}
.sup-stage.token{background:var(--blue-soft);color:var(--blue)}
.sup-stage.nego{background:var(--amber-soft);color:var(--amber)}

/* settings */
.set-grid{grid-template-columns:1fr 1fr}
.integ{display:flex;align-items:center;gap:13px;padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.integ .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:800;color:#fff;font-family:"Bricolage Grotesque"}
.integ .nm{font-weight:700;font-size:14px}
.integ .ds{font-size:12px;color:var(--muted)}
.switch{margin-left:auto;width:42px;height:24px;border-radius:20px;background:#cdd5e2;position:relative;cursor:pointer;transition:.18s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.18s}
.switch.on{background:var(--emerald)}.switch.on::after{left:21px}
.code{font-family:"Spline Sans Mono";font-size:12px;background:var(--ink-sidebar);color:#7ee0aa;padding:11px 13px;border-radius:9px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.code button{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit;font-size:11px}

.role-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.role-row:last-child{border-bottom:0}
.perm{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2)}
.perm.full{background:var(--emerald-soft);color:#06694b;border-color:#aedcc4}
.perm.view{background:var(--blue-soft);color:var(--blue);border-color:#bcd2fc}

.note{font-size:12px;color:var(--muted);background:var(--panel-2);border:1px dashed var(--line);border-radius:9px;padding:11px 13px;margin-top:6px;line-height:1.5}
.kbd{font-family:"Spline Sans Mono";font-size:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.tabs{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:4px;width:fit-content;margin-bottom:16px}
.tab{padding:7px 14px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.tab.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.mand-flag{font-size:11px;color:var(--coral);font-weight:600;margin-top:8px;display:none}
.mand-flag.show{display:block}
.summary-box{background:linear-gradient(135deg,var(--violet-soft),#f5f1fe);border:1px solid #ddd2f8;border-radius:12px;padding:15px}
.summary-box .ai{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--violet);margin-bottom:8px}
.rec{display:flex;align-items:center;gap:11px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.rec .play{width:34px;height:34px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;cursor:pointer}
.rec .wave{flex:1;height:24px;display:flex;align-items:center;gap:2px}
.rec .wave i{width:2.5px;background:#cdd5e2;border-radius:2px}
</style>
</head>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="12 2 15 8.5 22 9.5 17 14.5 18.5 21.5 12 18 5.5 21.5 7 14.5 2 9.5 9 8.5"/></svg>
        Gold Mine <span class="badge gold" id="nav-gm-badge">7</span>
      </div>

];

// days since a lead was qualified (confirmed on call). Seeded leads use qualifiedDaysAgo; live ones use a timestamp.
function daysSinceQualified(l){
  if(typeof l.qualifiedAt==='number') return (Date.now()-l.qualifiedAt)/86400000;
  if(typeof l.qualifiedDaysAgo==='number') return l.qualifiedDaysAgo;
  return 0;
}
function isActiveLead(l){return l.confirmed && !['won','lost','future','timepass'].includes(l.stage);}
const LEAD_SEGMENTS={
  // Qualified = confirmed & active & within 7 days of qualifying. After 7 days it auto-moves to Pipeline.
  qualified:{sub:"Confirmed on call, within 7 days of qualifying. After 7 days a lead auto-moves to Pipeline.",f:l=>isActiveLead(l)&&daysSinceQualified(l)<7},
  pipeline:{sub:"Qualified leads that have aged 7+ days in the funnel — still active.",f:l=>isActiveLead(l)&&daysSinceQualified(l)>=7},
  converted:{sub:"Won — token received.",f:l=>l.stage==='won'},
};
let current="dashboard";
function go(view){
  current=view;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===view));
  render();
  updateHeading();
  document.getElementById('view').scrollTop=0;
}
function currentUserName(){return document.getElementById('role-name')?.textContent||'Admin';}
function pageHeading(view){return view==='dashboard'?`Hello, ${currentUserName()}`:(TITLES[view]||view);}
function updateHeading(){
  const el=document.getElementById('page-title'); if(!el)return;
  if(document.getElementById('timeline')){el.textContent='Lead Details';return;} // viewing a lead detail
  el.textContent=pageHeading(current);
}
document.getElementById('nav').addEventListener('click',e=>{const i=e.target.closest('.nav-item');if(i)go(i.dataset.view)});

function render(){
  const v=document.getElementById('view');
  if(current==='dashboard')v.innerHTML=tplDashboard();
  else if(current==='newleads')v.innerHTML=tplNewLeads();
  else if(LEAD_SEGMENTS[current])v.innerHTML=tplLeads();
  else if(current==='reminders')v.innerHTML=tplReminders();
  else if(current==='inventory')v.innerHTML=tplInventory();
  else if(current==='supply')v.innerHTML=tplSupply();
  else if(current==='society')v.innerHTML=tplSociety();
  else if(current==='goldmine')v.innerHTML=tplGoldmine();
  else if(current==='settings')v.innerHTML=tplSettings();

}

/* ============================================================
   HELPERS
   ============================================================ */
function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function tatChip(t){
  if(t===null)return '<span style="color:var(--muted);font-size:12px">—</span>';
  if(t<0)return `<span class="tat breach">⚠ ${Math.abs(t)}m over</span>`;
  if(t<30)return `<span class="tat warn">${t}m left</span>`;
  return `<span class="tat ok">${t}m left</span>`;
}
function followChip(n){
  if(n===null||n===undefined)return '';
  if(n<0)return `<span class="fu over">⏰ ${Math.abs(n)}d overdue</span>`;
  if(n===0)return `<span class="fu today">⏰ Due today</span>`;
  if(n===1)return `<span class="fu up">⏰ Tomorrow</span>`;
  return `<span class="fu up">⏰ in ${n}d</span>`;
}
function outcomeChip(o,att){
  if(!o)return '';
  const cls=o==='connected'?'oc ok':'oc bad';
  return `<span class="${cls}">${OUTCOME_LABEL[o]}${att?` <span class="att">·${att}×</span>`:''}</span>`;
}
function flameHTML(l){return l.hot?`<span class="flame" title="Immediate / ready buyer">🔥</span>`:''}
// active (non-terminal) lead with a callback set
function followDue(l){return l.followIn!==null&&l.followIn!==undefined&&!TERMINAL.includes(l.stage)}
function refreshBadges(){
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  const m=myLeads();
  set('nav-new-badge',m.filter(l=>l.stage==='new').length);
  set('nav-qual-badge',m.filter(LEAD_SEGMENTS.qualified.f).length);
  set('nav-pipe-badge',m.filter(LEAD_SEGMENTS.pipeline.f).length);
  set('nav-conv-badge',m.filter(LEAD_SEGMENTS.converted.f).length);
  set('nav-gm-badge',DORMANT.length);
  set('top-rem-badge',REMINDERS.filter(r=>!r.done).length);
}

let _flashTimer=null,_flashLock=false;
function flashNew(on){
  const el=document.getElementById('needing-action'); if(!el)return;

function lossInsight(){
  const lost=LEADS.filter(l=>l.stage==='lost');
  const op=lost.filter(l=>l.lostType==='operational').length;
  const gen=lost.filter(l=>l.lostType==='genuine').length;
  if(!lost.length)return `<div class="empty" style="padding:22px">No lost leads recorded.</div>`;
  const counts={};
  lost.forEach(l=>{const r=l.lostReason||'Unspecified';counts[r]=(counts[r]||0)+1;});
  const max=Math.max(...Object.values(counts),1);
  const rows=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([r,c])=>{
    const t=LOSS_TYPE[r]||'genuine';
    return `<div class="loss-row ${t==='operational'?'op':'gen'}">
      <span class="loss-tag ${t==='operational'?'op':'gen'}">${t==='operational'?'Ops':'Genuine'}</span>
      <span class="ln" title="${r}">${r}</span>
      <span class="lbar"><i style="width:${c/max*100}%"></i></span>
      <span class="lc">${c}</span>
    </div>`;
  }).join('');
  return `
  <div class="loss-split">
    <div class="box op"><div class="n">${op}</div><div class="lab">Operational — recoverable</div></div>
    <div class="box gen"><div class="n">${gen}</div><div class="lab">Genuine</div></div>
  </div>
  ${rows}
  <div class="note">${op} of ${lost.length} losses were <b>operational</b> (ground-team no-show, broker, missed follow-up) — revenue we can win back, not lost demand.</div>`;
}
function funnel(){
  const rows=[["New / Contacted","var(--blue)",LEADS.filter(l=>['new','contacted'].includes(l.stage)).length],

    ["Negotiation","var(--indigo)",LEADS.filter(l=>l.stage==='nego').length],
    ["Won","var(--emerald)",LEADS.filter(l=>l.stage==='won').length]];
  const max=Math.max(...rows.map(r=>r[2]),1);
  return rows.map(([n,c,v])=>`
   <div style="margin-bottom:12px">
     <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px"><span style="font-weight:600">${n}</span><span style="font-family:'Spline Sans Mono';color:var(--muted)">${v}</span></div>

}

/* requirement-match ranking for the matched-options lists on the lead detail */
function leadReq(l){
  const c=l.confirmed;
  return {
    city:(c&&l.city)?l.city:l.meta.city,
    band:l.meta.budget,                                   // source band (confirmed budget is a free value)
    config:(c&&l.interest)?l.interest:l.meta.interest,
    societies:(c&&l.societies&&l.societies.length)?l.societies:(l.meta.society?[l.meta.society]:[])
  };
}
function scoreUnit(req,u){
  let s=0;
  if(u.city===req.city) s+=40;
  if(req.societies.includes(u.society)) s+=35;
  if(u.band===req.band) s+=25;
  if(u.bhk===req.config) s+=20;
  return s;
}
function matchedInventory(l){const req=leadReq(l);return INVENTORY.map(u=>({u,s:scoreUnit(req,u)})).sort((a,b)=>b.s-a.s).slice(0,5);}
function matchedSupply(l){const req=leadReq(l);return SUPPLY.map(u=>({u,s:scoreUnit(req,u)})).sort((a,b)=>b.s-a.s).slice(0,5);}

/* telecaller confirms call data */
function saveLead(){
  const purpose=val('f-purpose'),budgetRaw=val('f-budget'),config=val('f-interest'),office=val('f-office');
  let ok=true;
  [['f-purpose',purpose],['f-budget',budgetRaw],['f-interest',config],['f-office',office]].forEach(([id,x])=>{
    document.getElementById(id).closest('.field').classList.toggle('invalid',!x); if(!x)ok=false;
  });
  document.getElementById('mand-flag').classList.toggle('show',!ok);
  if(!ok){toast('Please fill the required (*) fields','gold','⚠');return;}
  const societies=msSelected('society');
  const localities=msSelected('locality');
  activeLead.purpose=purpose;
  activeLead.budgetRaw=parseFloat(budgetRaw);
  activeLead.budget=`₹${lacs(budgetRaw)} L`;
  activeLead.interest=config;
  activeLead.societies=societies;
  activeLead.society=societies[0]||activeLead.meta.society;   // keep a primary society for matching
  activeLead.localities=localities;
  activeLead.city=activeLead.city||activeLead.meta.city;       // city inherited from source (no separate field now)
  activeLead.office=office;
  activeLead.officeDate=val('f-office-date');
  activeLead.confirmed=true;
  if(typeof activeLead.qualifiedAt!=='number'&&typeof activeLead.qualifiedDaysAgo!=='number'){activeLead.qualifiedAt=Date.now();}  // start the 7-day clock
  if(activeLead.stage==='new'){activeLead.stage='contacted';activeLead.tat=null;
    activeLead.history.unshift({t:'Confirmed on call — qualified',r:`${purpose} · ₹${lacs(budgetRaw)}L · ${config}${office?` · office visit: ${office}`:''}`,m:'Just now',dim:false});}
  else activeLead.history.unshift({t:'Call details re-confirmed',m:'Just now',dim:false});
  document.getElementById('timeline').innerHTML=renderTimeline(activeLead);
  refreshBadges();
  toast('Lead data confirmed','green','✓');
}

/* match inventory — uses CONFIRMED data if telecaller has confirmed, else META data */
function renderSuggest(){
  const l=activeLead;if(!l)return;
  const useConfirmed = l.confirmed && l.budget && l.society;
  const data = useConfirmed
    ? {budget:l.budget,city:l.city,society:l.society,interest:l.interest}
    : {budget:l.meta.budget,city:l.meta.city,society:l.meta.society,interest:l.meta.interest};
  const banner=document.getElementById('suggest-source');
  if(banner){
    banner.innerHTML = useConfirmed
      ? `<div class="src-banner confirmed">✓ Matched on <b>call-confirmed</b> data · ${data.city} · ${data.budget} · ${data.interest}</div>`
      : `<div class="src-banner meta">⬤ Matched on <b>${SRC_LABEL[l.src]}</b> data · ${data.city} · ${data.budget} · ${data.interest}<br><span style="opacity:.75">Confirm details on the call to refine this.</span></div>`;
  }
  // score: city is a hard filter; budget + society + config add weight
  const matches=INVENTORY
    .filter(p=>!data.city||p.city===data.city)
    .filter(p=>p.band===data.budget||p.society===data.society||p.bhk===data.interest)
    .map(p=>({p,score:(p.city===data.city?20:0)+(p.band===data.budget?35:0)+(p.society===data.society?30:0)+(p.bhk===data.interest?15:0)}))
    .sort((a,b)=>b.score-a.score);
  const box=document.getElementById('suggest-list');
  if(!box)return;
  box.innerHTML = matches.length? `<div class="grid cards-2">${matches.map(m=>invCard(m.p,m.score)).join('')}</div>`
    : `<div class="empty">No live unit matches in ${data.city||'this city'} yet — system will flag this lead the moment matching inventory is added (see Gold Mine).</div>`;
}

      <span class="tag">${p.status}</span>
      ${showMatch?`<span class="match">${Math.min(score+5,99)}% match</span>`:''}
    </div>
    <div class="inv-body">
      <div class="nm">${p.name}</div>
      <div class="loc">📍 ${p.loc}</div>

      <div class="inv-actions">
        <button class="btn wa sm" style="flex:1" onclick="shareToast('${p.name}')">↗ Share brochure</button>
        <button class="btn ghost sm" onclick="toast('Opening ${p.name} details','blue','🏠')">Details</button>

}
let pendingStage=null, prevStageVal=null;
function changeStage(){
  const s=val('f-stage'); if(!activeLead)return;
  if(s===activeLead.stage)return;
  pendingStage=s;
  prevStageVal=activeLead.stage; // so we can revert the dropdown if cancelled
  openStageRemark(s);
}
function openStageRemark(s){
  document.getElementById('overlay').innerHTML=`
  <div class="modal">
    <div class="mh"><h3>Move to “${STAGE_LABEL[s]}”</h3><div class="icon-btn" onclick="cancelStageChange()">✕</div></div>
    <div class="mb">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <span class="stage ${activeLead.stage}">${STAGE_LABEL[activeLead.stage]}</span>
        <svg width="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <span class="stage ${s}">${STAGE_LABEL[s]}</span>
      </div>
      <div class="field" id="stage-remark-field">
        <label>Remark for this stage change <span class="req">*</span></label>
        <textarea id="stage-remark" rows="3" placeholder="Why is the stage moving? e.g. Client confirmed visit for Sat 11 AM, wants east-facing 3BHK."></textarea>
        <div class="mand-flag" id="stage-remark-flag">⚠ A remark is required to change the stage — it's saved to the lead history.</div>
      </div>
      ${s==='lost'?`
      <div class="field" id="loss-field">
        <label>Loss reason <span class="req">*</span></label>
        <select id="loss-reason">${LOSS_REASONS.map(r=>`<option value="${r.v}">${r.v} — ${r.t==='operational'?'recoverable':'genuine'}</option>`).join('')}</select>
        <div class="note" style="margin-top:6px">Operational losses (ground-team no-show, broker, missed follow-up) are tracked separately as <b>recoverable</b> on the dashboard.</div>
      </div>`:''}
      <div class="note" style="margin-top:0">Every stage move is logged with who moved it and the remark, so the history stays auditable.</div>
    </div>
    <div class="mf">
      <button class="btn ghost" onclick="cancelStageChange()">Cancel</button>
      <button class="btn green" onclick="commitStageChange()">Save & move stage</button>
    </div>
  </div>`;
  document.getElementById('overlay').classList.add('show');
  setTimeout(()=>{const t=document.getElementById('stage-remark');if(t)t.focus();},50);
}
function cancelStageChange(){
  // revert the dropdown selection
  const sel=document.getElementById('f-stage'); if(sel&&prevStageVal)sel.value=prevStageVal;
  pendingStage=null; closeModal();
}
function commitStageChange(){
  const remark=val('stage-remark').trim();
  if(!remark){
    document.getElementById('stage-remark-field').classList.add('invalid');
    document.getElementById('stage-remark-flag').classList.add('show');
    return;
  }
  const s=pendingStage;
  if(s==='lost'){
    const lr=val('loss-reason')||'Unspecified';
    activeLead.lostReason=lr; activeLead.lostType=LOSS_TYPE[lr]||'genuine';
  }
  activeLead.stage=s;
  activeLead.history.forEach(h=>h.dim=true);
  const evt = s==='lost' ? `Moved to Lost — ${activeLead.lostReason} · by ${roleActor()}` : `Moved to ${STAGE_LABEL[s]} · by ${roleActor()}`;
  activeLead.history.unshift({t:evt,r:remark,m:'Just now',dim:false});
  closeModal();
  document.getElementById('timeline').innerHTML=renderTimeline(activeLead);
  if(s==='visit'){
    REMINDERS.unshift({id:Date.now(),type:'feedback',lead:activeLead.name,text:'Take visit feedback (auto +2 hrs)',when:'+2 hrs from now',done:false});
    refreshLeadReminders();
    toast('Stage moved · feedback reminder auto-set +2 hrs','gold','⏰');
  } else toast(`Stage → ${STAGE_LABEL[s]} · remark saved`,'green','✓');
  pendingStage=null;
}
function roleActor(){return document.getElementById('role-name')?.textContent||'You';}
function followLabel(n){if(n===null||n===undefined)return 'none';if(n<0)return `${Math.abs(n)}d overdue`;if(n===0)return 'today';if(n===1)return 'tomorrow';return `in ${n}d`;}
function saveCallTracking(){
  if(!activeLead)return;
  const o=val('ct-outcome'), f=val('ct-follow'), note=val('ct-note');
  const hot=!!document.getElementById('ct-hot')?.checked;
  activeLead.outcome=o;
  activeLead.followIn = f===''?null:parseInt(f,10);
  activeLead.followNote=note;
  activeLead.hot=hot;
  activeLead.history.unshift({t:`Call tracking updated${o?` · ${OUTCOME_LABEL[o]}`:''}${activeLead.followIn!==null?` · callback ${followLabel(activeLead.followIn)}`:''}${hot?' · 🔥 immediate buyer':''}`,m:'Just now',dim:false});
  document.getElementById('view').innerHTML=tplLeadDetail(activeLead);
  renderSuggest();
  toast('Call tracking saved','green','✓');
}
function logAttempt(){
  if(!activeLead)return;
  activeLead.attempts=(activeLead.attempts||0)+1;
  document.getElementById('view').innerHTML=tplLeadDetail(activeLead);
  renderSuggest();
  toast(`Attempt #${activeLead.attempts} logged`,'blue','📞');
}
function renderTimeline(l){
  return l.history.map(h=>`
    <div class="tl-item ${h.dim?'dim':''}">
      <div class="tt">${h.t}</div>
      ${h.r?`<div class="tl-remark">“${h.r}”</div>`:''}
      <div class="tm">${h.m}</div>

function cityOfSociety(s){ for(const[c,list] of Object.entries(SOCIETIES_BY_CITY)){ if(list.includes(s))return c; } return ''; }
function societyStats(){
  const map={};
  Object.entries(SOCIETIES_BY_CITY).forEach(([city,list])=>list.forEach(s=>{map[s]={society:s,city,demand:0,units:0,hot:0,notes:[]};}));
  Object.entries(SOCIETY_NOTES).forEach(([s,o])=>{ if(!map[s])map[s]={society:s,city:o.city||'—',demand:0,units:0,hot:0,notes:[]}; map[s].notes=(o.notes||[]).slice(); });
  allLeadReqs().forEach(r=>{ if(r.society&&map[r.society])map[r.society].demand++; });
  myLeads().forEach(l=>{ const s=(l.confirmed&&l.society)?l.society:(l.meta&&l.meta.society); if(l.hot&&s&&map[s])map[s].hot++; });
  INVENTORY.forEach(p=>{ if(map[p.society])map[p.society].units++; });
  return Object.values(map).filter(s=>s.demand>0||s.units>0||s.notes.length>0).sort((a,b)=>b.demand-a.demand);
}
function tplSociety(){
  const stats=societyStats();
  const maxD=Math.max(...stats.map(s=>s.demand),1);
  const totalDemand=stats.reduce((a,s)=>a+s.demand,0);
  const gaps=stats.filter(s=>s.demand>=2&&s.units<=1).length;
  return `
  <div class="section-head">
    <p class="sec-sub" style="margin:0;max-width:780px">Where buyer demand is concentrated vs. how much live inventory we hold — so we know which societies to source. Demand counts every lead (active + dormant) whose requirement points to that society. Add what buyers commonly ask about a society below.</p>

    <div class="card stat" style="--accent:var(--gold)"><div class="ico" style="background:var(--gold-soft);color:var(--gold)">★</div><div class="k">Societies tracked</div><div class="v">${stats.length}</div></div>
    <div class="card stat" style="--accent:var(--blue)"><div class="ico" style="background:var(--blue-soft);color:var(--blue)">●</div><div class="k">Total buyer demand</div><div class="v">${totalDemand}</div></div>
    <div class="card stat" style="--accent:var(--emerald)"><div class="ico" style="background:var(--emerald-soft);color:var(--emerald)">▦</div><div class="k">Live units</div><div class="v">${INVENTORY.length}</div></div>

  </div>
  <div class="grid cards-3">
  ${stats.map(s=>{
    const gap=s.demand-s.units;
    const opp=s.demand>=2&&s.units<=1;
    return `<div class="card panel-pad" style="${opp?'border-color:#ead9a0;background:linear-gradient(135deg,#fdf7e6,#fff)':''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="min-width:0"><div style="font-weight:700;font-size:14px">${s.society}</div><div style="font-size:12px;color:var(--muted)">📍 ${s.city}</div></div>
        ${opp?'<span class="bucket-tag">High demand</span>':''}
      </div>
      <div style="display:flex;gap:18px;margin:14px 0 8px">
        <div><div style="font-family:'Bricolage Grotesque';font-weight:800;font-size:24px;line-height:1;color:var(--gold)">${s.demand}</div><div style="font-size:11px;color:var(--muted);font-weight:600">Buyers</div></div>
        <div><div style="font-family:'Bricolage Grotesque';font-weight:800;font-size:24px;line-height:1;color:var(--emerald)">${s.units}</div><div style="font-size:11px;color:var(--muted);font-weight:600">Live units</div></div>
        <div><div style="font-family:'Bricolage Grotesque';font-weight:800;font-size:24px;line-height:1;color:${gap>0?'var(--coral)':'var(--ink-2)'}">${gap>0?'+'+gap:gap}</div><div style="font-size:11px;color:var(--muted);font-weight:600">Demand gap</div></div>
      </div>
      <div class="interest-bar"><i style="width:${s.demand/maxD*100}%"></i></div>
      ${s.hot?`<div style="font-size:11.5px;color:#c2410c;font-weight:600;margin-top:6px">🔥 ${s.hot} immediate buyer${s.hot>1?'s':''}</div>`:''}
      <div style="margin-top:10px;border-top:1px solid var(--line-2);padding-top:10px">

   ============================================================ */
/* unified requirement view of EVERY lead (active + dormant), using telecaller-confirmed data, falling back to source-captured */
function allLeadReqs(){
  const fromActive = myLeads().map(l=>{
    const c = l.confirmed && l.society;
    return {name:l.name,phone:l.phone,
      budget:c?l.budget:l.meta.budget, city:c?l.city:l.meta.city,
      society:c?l.society:l.meta.society, interest:c?l.interest:l.meta.interest,
      basis:c?'Confirmed on call':`From ${SRC_LABEL[l.src]}`, stage:l.stage};
  });
  // dormant pool is unassigned — shown to Admin & Closing Managers, not individual RMs
  const fromDormant = currentUser().role==='RM' ? [] : DORMANT.map(d=>({name:d.name,phone:d.phone,budget:d.budget,city:d.city,
    society:d.society,interest:d.interest,basis:`Dormant · ${d.age}`,stage:'future'}));
  return [...fromActive,...fromDormant];
}
// does a lead's requirement match an upcoming unit?  city is a hard filter.
function matchScore(req,unit){
  if(req.city!==unit.city) return 0;
  let s=20; // same city
  if(req.society===unit.society) s+=45;
  if(req.budget===unit.band)    s+=25;
  if(req.interest===unit.bhk)   s+=20;
  // require society OR (budget+config) to count as a real match
  const realMatch = req.society===unit.society || (req.budget===unit.band && req.interest===unit.bhk);
  return realMatch? s : 0;
}
function bucketLeadsFor(unit){
  return allLeadReqs().map(r=>({r,score:matchScore(r,unit)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
}

/* distance/time — haversine estimate (instant, no key); upgraded to Google driving values when available */
function haversine(a,b){
  const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  const s=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function estLeg(a,b){ const km=haversine(a,b)*1.4; return {km:+km.toFixed(1),min:Math.max(1,Math.round(km/26*60))}; }
function fmtMin(m){ if(m<60)return `${m} min`; const h=Math.floor(m/60),mm=m%60; return `${h}h ${mm?mm+'m':''}`.trim(); }
function computeEstMetrics(){
  const legs=[]; let tk=0,tm=0;
  for(let i=0;i<planStops.length-1;i++){ const l=estLeg(invById(planStops[i]),invById(planStops[i+1])); legs.push(l); tk+=l.km; tm+=l.min; }
  return {legs,totalKm:+tk.toFixed(1),totalMin:tm,source:'est'};
}

function initPlanMap(){

function loadMapsApi(cb){
  if(gmapsReady()){cb();return;}
  if(gmapsLoading){ const t=setInterval(()=>{if(gmapsReady()){clearInterval(t);cb();}},150); return; }
  gmapsLoading=true;
  window.__gmapsCb=function(){cb();};
  const s=document.createElement('script');
  s.src=`https://maps.googleapis.com/maps/api/js?key=${MAPS_API_KEY}&callback=__gmapsCb`;
  s.async=true;
  s.onerror=()=>{const el=document.getElementById('plan-map'); if(el)el.innerHTML='<div class="map-empty">Could not load Google Maps — check the API key & billing.</div>';};
  document.head.appendChild(s);
}
function drawPlanMapBase(){
  const el=document.getElementById('plan-map'); if(!el||!gmapsReady())return;
  _map=new google.maps.Map(el,{center:{lat:28.46,lng:77.05},zoom:10,mapTypeControl:false,streetViewControl:false,fullscreenControl:false});
  _dirSvc=new google.maps.DirectionsService();
  _dirRend=new google.maps.DirectionsRenderer({map:_map,suppressMarkers:true,polylineOptions:{strokeColor:'#2563eb',strokeWeight:5,strokeOpacity:.85}});
  drawRoute();
}
function drawRoute(){
  if(!_map||!gmapsReady())return; // map not ready; itinerary/estimates still work
  _markers.forEach(m=>m.setMap(null)); _markers=[];
  if(_dirRend)_dirRend.set('directions',null);
  const stops=planStops.map(invById);
  if(!stops.length)return;
  const bounds=new google.maps.LatLngBounds();
  stops.forEach((p,i)=>{
    const m=new google.maps.Marker({position:{lat:p.lat,lng:p.lng},map:_map,label:{text:String(i+1),color:'#fff',fontWeight:'700'},title:`Visit ${i+1} · ${p.name}`});
    _markers.push(m); bounds.extend(m.getPosition());
  });
  _map.fitBounds(bounds,60);
  if(stops.length>=2){
    _dirSvc.route({
      origin:{lat:stops[0].lat,lng:stops[0].lng},
      destination:{lat:stops[stops.length-1].lat,lng:stops[stops.length-1].lng},
      waypoints:stops.slice(1,-1).map(p=>({location:{lat:p.lat,lng:p.lng},stopover:true})),
      travelMode:google.maps.TravelMode.DRIVING
    },(res,status)=>{
      if(status==='OK'&&res.routes&&res.routes[0]){
        _dirRend.setDirections(res);
        const legs=res.routes[0].legs.map(l=>({km:+(l.distance.value/1000).toFixed(1),min:Math.round(l.duration.value/60)}));
        routeMetrics={legs,totalKm:+legs.reduce((a,l)=>a+l.km,0).toFixed(1),totalMin:legs.reduce((a,l)=>a+l.min,0),source:'google'};
        renderPlanner();
      } // else: keep haversine estimate already shown
    });
  }
}

/* ---- route optimisation (shortest trip across the selected stops) ---- */
function routeTotalKm(order){ let t=0; for(let i=0;i<order.length-1;i++)t+=haversine(invById(order[i]),invById(order[i+1])); return t; }
function twoOpt(route){
  let improved=true;
  while(improved){
    improved=false;
    for(let i=0;i<route.length-1;i++){
      for(let k=i+1;k<route.length;k++){
        const cand=route.slice(0,i).concat(route.slice(i,k+1).reverse(),route.slice(k+1));
        if(routeTotalKm(cand)<routeTotalKm(route)-1e-9){route=cand;improved=true;}
      }
    }
  }
  return route;
}
function optimizeRoute(){
  if(planStops.length<3){ toast('Add 3+ stops to optimise the route','gold','⚠'); return; }
  const before=computeEstMetrics();
  const ids=planStops.slice();
  // nearest-neighbour seed from every possible start, keep the best
  let best=null,bestKm=Infinity;
  for(let s=0;s<ids.length;s++){
    const unv=ids.slice(), route=[unv.splice(s,1)[0]];
    while(unv.length){
      const last=route[route.length-1]; let bi=0,bd=Infinity;
      unv.forEach((id,idx)=>{const d=haversine(invById(last),invById(id)); if(d<bd){bd=d;bi=idx;}});
      route.push(unv.splice(bi,1)[0]);
    }
    const km=routeTotalKm(route);
    if(km<bestKm){bestKm=km;best=route;}
  }
  best=twoOpt(best);                 // refine to (near-)optimal
  planStops=best;
  refreshPlan();
  const after=computeEstMetrics();
  const dKm=+(before.totalKm-after.totalKm).toFixed(1), dMin=before.totalMin-after.totalMin;
  if(dKm>0.05||dMin>0) toast(`Best route found · saved ${dKm} km · ${dMin} min`,'green','🧭');
  else toast('Route is already the shortest','blue','🧭');
}

function metaAuthorize(){

function toggleMetaForm(id,el){const f=META_FORMS.find(x=>x.id===id);f.on=!f.on;el.classList.toggle('on');document.getElementById('meta-body').innerHTML=metaFormsView();}
function pullMetaLeads(){
  const count=META_FORMS.reduce((a,f)=>a+(f.on?f.leads:0),0);
  let added=0;
  for(let i=0;i<count;i++){
    const [name,cfg,budget,society]=META_POOL[i%META_POOL.length];
    const city = society.includes('Sec 152')||society.includes('Sec 43')||society.includes('Sec 107')?'Noida':society.includes('Noida Ext')||society.includes('Tech Zone')||society.includes('Raj Nagar')?'Ghaziabad':'Gurgaon';
    LEADS.unshift({id:++leadSeq,name,phone:"+91 9"+Math.floor(1000000000+Math.random()*899999999),src:"meta",stage:"new",tat:60,assigned:"You",
      meta:{budget,city,society,interest:cfg,plan:PLAN_OPTS[Math.floor(Math.random()*PLAN_OPTS.length)]},
      budget:"",city:"",society:"",interest:"",visit:"",remark:"",confirmed:false,
      history:[{t:"Lead created via Meta Instant Form",m:"Just now",dim:false}],recs:[]});
    REMINDERS.unshift({id:Date.now()+i,type:'follow',lead:name,text:'First call — within TAT (1 hr)',when:'Due in 60 min',done:false});
    added++;
  }
  META_FORMS.forEach(f=>{if(f.on)f.leads=0});
  closeModal();
  refreshBadges();
  if(current==='dashboard'&&!document.getElementById('timeline'))render();
  toast(`${added} Meta leads pulled → WhatsApp alerts fired`,'wa','↓');
}

/* ============================================================
   TOASTS
   ============================================================ */
function toast(msg,kind='green',icon='✓'){
  const t=document.createElement('div');
  t.className='toast '+kind;
  t.innerHTML=`<div class="ic" style="color:#fff;font-size:14px">${icon}</div><div>${msg}</div>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{t.style.transition='.3s';t.style.opacity='0';t.style.transform='translateX(40px)';setTimeout(()=>t.remove(),300)},3400);
}
function waToast(name){toast(`Opening WhatsApp chat with ${name}`,'wa','✓')}
function shareToast(prop){toast(`Brochure for ${prop} sent on WhatsApp`,'wa','↗')}
function bulkShareToast(name){toast(`New unit sent to ${name} on WhatsApp`,'wa','↗')}
let CURRENT_ROLE="Admin";
function cycleRole(){
  window._ri=((window._ri||0)+1)%ROLE_CYCLE.length;

  activeLead=null; // drop any open lead so we don't show one out of the new user's scope
  document.getElementById('role-av').textContent=u.initials;
  document.getElementById('role-name').textContent=u.name;
  document.getElementById('role-chip').textContent=u.role;
  document.getElementById('role-team').textContent=u.team;
  toast(`Viewing as ${u.name} · ${ROLE_FULL[u.role]}`,'blue','⇄');

  updateHeading();       // refresh "Hello, {user}"
}
