# Render blueprint — deploys the FastAPI backend.
# Dashboard → New → Blueprint → point at this repo, or create a Web Service
# manually with the same settings.
services:
  - type: web
    name: direct-demand-api
    runtime: python
    # MUST match the Neon region (ap-southeast-1 / Singapore). Every query pays the
    # round trip, so an Oregon service talking to a Singapore DB crosses the Pacific
    # on every single one. Render fixes a service's region at creation — changing this
    # line does NOT move an existing service; you have to create a new one.
    region: singapore
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        sync: false # paste the Neon URL in the dashboard
      - key: PROPERTIES_DATABASE_URL
        sync: false # paste the supply DB URL
      - key: DIRECT_INVENTORY_DB_URL
        sync: false # oh_pricing reference prices — WITHOUT this the Supply Pipeline
                    # loses unit pricing and /v1/health just says "not_configured"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false # paste the FULL service-account JSON (inline, single line)
      - key: SHEET_ID
        value: "1-kxlCnXUv7absl4rpWeMoYIxSAHpWykyjpd9v_5df-o"
      - key: SYNC_INTERVAL_MINUTES
        value: "15"
      # PHOTOS_API_URL has a baked-in default; set it here only if the service moves
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-app.vercel.app (comma-separated for previews)
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app$" # allow Vercel preview deploys
      # --- production hardening (fail-closed) ---
      - key: APP_ENV
        value: "prod"             # enables fail-closed checks below
      - key: JWT_SECRET
        sync: false               # REQUIRED in prod: a strong random secret (>=16 chars)
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false               # REQUIRED in prod: enforces login (no open-access)
      - key: REDIS_URL
        sync: false               # Upstash rediss:// URL — shared cache + rate-limit + cron lock
      - key: LOG_JSON
        value: "true"
      - key: CRM_BOOKING_API_BASE_URL
        sync: false               # Openhouse Core base, ends in /api/v1/oh/
      - key: CRM_API_KEY
        sync: false               # X-CRM-Key secret (server-to-server only)
      - key: MAPS_API_KEY
        sync: false               # server-side Geocoding key (referrer-restricted)
      - key: GUPSHUP_WEBHOOK_SECRET
        sync: false               # ?token= on the Gupshup callback URL (public endpoint)
      - key: GUPSHUP_API_KEY
        sync: false               # all three needed to SEND; receiving needs none
      - key: GUPSHUP_SOURCE_NUMBER
        sync: false               # WABA number, country code included, digits only
      - key: GUPSHUP_APP_NAME
        sync: false               # Gupshup app bound to that number (sent as src.name)
      # --- Bonvoice PBX (click-to-call + call-log sync) ---
      # Every Bonvoice endpoint (auth, autoCallBridging, callrecords) is on the
      # `backend.` host — the bare pbx host answers nginx 405 for all of them, which
      # shows up as a 502 on every click-to-call. Settings.bonvoice_base rewrites a
      # bare host to `backend.` anyway, so this is belt-and-braces.
      - key: BONVOICE_BASE_URL
        value: "https://backend.pbx.bonvoice.com"
      - key: BONVOICE_USERNAME
        sync: false
      - key: BONVOICE_PASSWORD
        sync: false               # or set BONVOICE_TOKEN instead
      - key: BONVOICE_TOKEN
        sync: false               # pre-issued long-lived token; skips the login call
      # Scheduled call-log pull (safety net for dropped webhook callbacks). Both have
      # working defaults — set them only to change the cadence or the lookback.
      - key: BONVOICE_SYNC_INTERVAL_MINUTES
        value: "15"
      - key: BONVOICE_SYNC_LOOKBACK_DAYS
        value: "1"
      - key: BONVOICE_DID
        sync: false               # outgoing caller ID, e.g. 7946350641
      - key: BONVOICE_CHANNEL_ID
        sync: false               # channel id issued with the account, e.g. 12
      - key: BONVOICE_WEBHOOK_SECRET
        sync: false               # ?token= on the call-log callback URL
      - key: LEADS_SHEET_ID
        sync: false               # leads source sheet (or rely on the in-code default)
      # RUN_SCHEDULER defaults true. If you scale this web service to >1 instance,
      # set it "false" here and add a separate Background Worker service (same repo,
      # RUN_SCHEDULER=true) so the cron runs on exactly one instance.

# To run the same image as local compose, switch the service to the Docker runtime:
#   runtime: docker  /  dockerfilePath: backend/Dockerfile  /  dockerContext: backend
# (the native python+uv build above also works).
